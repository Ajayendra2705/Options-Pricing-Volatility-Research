name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  reproduce:
    # Raw data (60 KB) is tracked, so CI reproduces the whole project from it:
    # manifest -> pipeline -> tests -> independent verification scripts.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip

    - name: Install pinned dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify raw-data immutability (SHA256 manifest)
      run: python scripts/sha256_manifest.py --verify

    - name: Reproduce every result from raw data
      run: python main.py

    - name: Reproduced artifacts must match the committed ones (bit-identical)
      run: git diff --exit-code --stat

    - name: Tests
      run: pytest -q

    - name: Test run must not mutate tracked artifacts
      run: git diff --exit-code --stat

    - name: Independent verification scripts
      run: python scripts/verify/run_all.py
