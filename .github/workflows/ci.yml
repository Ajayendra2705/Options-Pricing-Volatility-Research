name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  reproduce:
    # Raw data (60 KB) is tracked, so CI reproduces the whole project from it:
    # manifest -> pipeline -> results match -> tests -> independent verification.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip

    - name: Install pinned dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify raw-data immutability (SHA256 manifest)
      run: python scripts/sha256_manifest.py --verify

    - name: Reproduce every result from raw data
      run: python main.py

    # Cross-platform, bytes cannot match: the artifacts are committed from Windows,
    # the constrained optimizers settle a different point of a flat optimum under a
    # different BLAS (~1e-5 on a fitted mark), and matplotlib rasterizes PNGs
    # differently. Downstream, that is amplified wherever a result is a small
    # difference of large numbers (gross_pnl ~ $3.8 nets +$505 against -$502, so a
    # cent moves it 2%). Hence: numbers within tolerance (relative OR absolute), and
    # — the check that actually matters — every CLAIM the project makes still holds.
    - name: Reproduced numbers match the committed results (rtol 1e-3 / atol $0.10)
      run: python scripts/compare_results.py --rtol 1e-3 --atol 0.10 --conclusions

    - name: Snapshot artifacts before tests
      run: sha256sum results/*.json data/processed/*.parquet > /tmp/before.sha

    - name: Tests
      run: pytest -q

    # A test run must never write into a tracked artifact (this repo has had that
    # bug twice: run_metrics overwriting metrics.json, run_cleaning writing
    # data_quality.json). Same machine, same run -> bytes must be untouched.
    - name: Tests must not mutate tracked artifacts
      run: sha256sum -c /tmp/before.sha --status

    # Determinism on a single platform: rerunning the pipeline must reproduce the
    # exact bytes it just produced.
    - name: Pipeline is byte-deterministic (rerun on same machine)
      run: |
        python main.py
        sha256sum -c /tmp/before.sha --status

    - name: Independent verification scripts
      run: python scripts/verify/run_all.py
