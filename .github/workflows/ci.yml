name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  reproduce:
    # Raw data (60 KB) is tracked, so CI reproduces the whole project from it:
    # manifest -> pipeline -> results match -> tests -> independent verification.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip

    - name: Install pinned dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify raw-data immutability (SHA256 manifest)
      run: python scripts/sha256_manifest.py --verify

    - name: Reproduce every result from raw data
      run: python main.py

    # Cross-platform the bytes cannot match: the artifacts are committed from
    # Windows, a different BLAS settles the near-flat SVI optimum a different
    # place (one AAPL slice is bistable, ~1 vol pt), and the near-zero gross-PnL
    # cancellation amplifies that to ~$17 on the headline. So this gate is:
    # structure / strings / flags identical + every CLAIM still holds. Numeric
    # drift is printed for inspection, not failed. Same-platform byte determinism
    # is the separate check below.
    - name: Reproduced results — structure and every project claim hold across platforms
      run: python scripts/compare_results.py --cross-platform

    - name: Snapshot artifacts before tests
      run: sha256sum results/*.json data/processed/*.parquet > /tmp/before.sha

    - name: Tests
      run: pytest -q

    # A test run must never write into a tracked artifact (this repo has had that
    # bug twice: run_metrics overwriting metrics.json, run_cleaning writing
    # data_quality.json). Same machine, same run -> bytes must be untouched.
    - name: Tests must not mutate tracked artifacts
      run: sha256sum -c /tmp/before.sha --status

    # Determinism on a single platform: rerunning the pipeline must reproduce the
    # exact bytes it just produced.
    - name: Pipeline is byte-deterministic (rerun on same machine)
      run: |
        python main.py
        sha256sum -c /tmp/before.sha --status

    - name: Independent verification scripts
      run: python scripts/verify/run_all.py
